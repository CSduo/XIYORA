<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>XIYORA — Premium Natural Latex Bedding</title>
    <meta name="description" content="XIYORA — Official Bingxi sourcing partner for India. Premium natural latex pillows, mattresses, toppers and cushions." />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="XIYORA — Premium Natural Latex Bedding" />
    <meta property="og:description" content="XIYORA — Official Bingxi sourcing partner for India. Premium natural latex pillows, mattresses, toppers and cushions." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="XIYORA — Premium Natural Latex Bedding" />
    <meta name="twitter:description" content="XIYORA — Official Bingxi sourcing partner for India. Premium natural latex pillows, mattresses, toppers and cushions." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preload" as="image" type="image/webp" href="/assets/lux/hero-bedroom.webp" fetchpriority="high" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&family=Inter:wght@100..900&family=Montserrat:wght@100..900&display=swap" rel="stylesheet">
    <style>
      /* ── CRITICAL CSS — loaded synchronously before React renders ──────────────
         These rules prevent layout flash by applying mobile layout from first paint.
         They are intentionally duplicated from the JS-injected CSS so they arrive
         before React's useEffect fires and injects the full stylesheet.
         IMPORTANT: body background must be DARK to match the React loader and
         prevent any light-flash/jerk during hydration. */

      *,*::before,*::after{box-sizing:border-box}
      /* Dark body background — matches React loader background exactly */
      body{background:#1a1a1a;color:#f5f2ed;margin:0;font-family:'Inter',sans-serif}
      /* #root container */
      #root{min-height:100vh}

      /* Side drawer: off-canvas BEFORE JavaScript loads */
      .sdrawer{
        position:fixed;top:0;left:0;height:100%;width:300px;max-width:85vw;
        background:#f5f2ed;z-index:500;overflow-y:auto;
        transform:translateX(-100%);
        transition:transform .32s cubic-bezier(.23,1,.32,1);
      }
      .sdrawer-overlay{display:none}

      /* ── LUX SPLIT HERO — mobile stacked layout from first paint ── */
      @media(max-width:900px){
        .lux-hero-photo{position:relative!important;width:100%!important;height:280px!important;overflow:hidden}
        .lux-hero-inner{min-height:auto!important;padding:36px 0!important;max-width:none!important}
        .lux-bamboo{display:none!important}
        .lux-hero-grid{grid-template-columns:1fr!important}
        .lux-hero-photo-r{order:-1!important;min-height:280px!important}
        .biz-grid{grid-template-columns:1fr!important;justify-items:center!important;text-align:center!important}
        .biz-feats{grid-template-columns:1fr 1fr!important;justify-content:center!important}
        .biz-medallion{display:none!important}
      }
      @media(max-width:560px){
        .lux-hero-photo{height:220px!important}
        .lux-hero-photo-r{min-height:220px!important}
        .lux-hero-inner{padding:28px 0!important}
      }

      /* ── STATIC LOADER — matches React LoadingScreen exactly ─────────────────
         Same dark background, same SVG logo, same brand typography.
         This is the loader seen before JavaScript executes.
         React will crossfade this out once mounted. */
      #xi-loader{
        position:fixed;inset:0;
        background:#1a1a1a;
        display:flex;flex-direction:column;align-items:center;justify-content:center;
        gap:0;z-index:99999;
        transition:opacity 0.4s cubic-bezier(.4,0,.2,1), transform 0.4s cubic-bezier(.4,0,.2,1);
        will-change:opacity,transform;
        overflow:hidden;
      }
      #xi-loader::before{
        content:'';
        position:absolute;inset:0;
        background:
          radial-gradient(ellipse 80% 60% at 20% 30%, rgba(200,195,186,0.04), transparent 55%),
          radial-gradient(ellipse 60% 50% at 80% 70%, rgba(200,195,186,0.03), transparent 55%);
        pointer-events:none;
      }
      /* Exit animation: fade + slight scale — matches .loader-exit in luxe.css */
      #xi-loader.xi-fade{
        opacity:0;
        transform:scale(1.03);
        pointer-events:none;
      }
      /* Horizontal sweep line */
      @keyframes xi-line-sweep{
        0%   {left:-100%;opacity:0}
        10%  {opacity:1}
        90%  {opacity:1}
        100% {left:100%;opacity:0}
      }
      #xi-loader .xi-sweep-line{
        position:absolute;top:50%;left:-100%;width:100%;height:1px;
        background:linear-gradient(to right,transparent,#C8C3BA 30%,#C8C3BA 50%,#C8C3BA 70%,transparent);
        animation:xi-line-sweep 0.6s cubic-bezier(.4,0,.2,1) 0.05s forwards;
        transform:translateY(-1px);
      }
      /* Logo entrance */
      @keyframes xi-logo-in{
        from{opacity:0;transform:translateY(28px) scale(.94);filter:blur(8px)}
        to  {opacity:1;transform:translateY(0) scale(1);filter:blur(0)}
      }
      #xi-loader .xi-mono{
        display:flex;flex-direction:column;align-items:center;gap:12px;
        animation:xi-logo-in 0.4s cubic-bezier(.22,1,.36,1) both;
        position:relative;z-index:2;
      }
      #xi-loader .xi-brand{
        font-family:'Cormorant Garamond',serif;
        font-size:48px;letter-spacing:16px;color:#f5f2ed;
        font-weight:400;line-height:1;
        margin-top:14px;
      }
      #xi-loader .xi-sub{
        font-family:'Inter',sans-serif;
        font-size:9.5px;letter-spacing:7px;
        text-transform:uppercase;color:#C8C3BA;
      }
      /* Stats row */
      @keyframes xi-count-in{
        from{opacity:0;transform:translateY(16px)}
        to  {opacity:1;transform:translateY(0)}
      }
      #xi-loader .xi-count-row{
        display:flex;gap:44px;margin-top:44px;
        animation:xi-count-in 0.5s cubic-bezier(.22,1,.36,1) 0.45s both;
        position:relative;z-index:2;
      }
      #xi-loader .xi-count-item{text-align:center;display:flex;flex-direction:column;gap:6px}
      #xi-loader .xi-count-num{font-family:'Cormorant Garamond',serif;font-size:30px;color:#C8C3BA;font-weight:400;letter-spacing:2px}
      #xi-loader .xi-count-label{font-family:'Inter',sans-serif;font-size:9px;letter-spacing:3px;text-transform:uppercase;color:rgba(245,238,240,0.4)}
      /* Bottom progress bar */
      @keyframes xi-progress{from{width:0}to{width:100%}}
      #xi-loader .xi-progress-bar{
        position:absolute;bottom:0;left:0;height:2px;
        background:linear-gradient(to right,transparent,#1a1a1a,#C8C3BA,#C8C3BA,transparent);
        animation:xi-progress 1.2s cubic-bezier(.4,0,.2,1) forwards;
        box-shadow:0 0 12px rgba(200,195,186,0.15);
      }
    </style>
  </head>
  <body>
    <!-- Loading screen: visible immediately, React crossfades it out once ready -->
    <div id="xi-loader" aria-hidden="true">
      <div class="xi-sweep-line"></div>
      <div class="xi-mono">
        <svg width="52" height="52" viewBox="0 0 48 48" fill="none" aria-hidden="true">
          <circle cx="24" cy="24" r="22" stroke="#ffffff" stroke-width="1.3"/>
          <circle cx="24" cy="24" r="17" stroke="#ffffff" stroke-width=".5" opacity=".4"/>
          <path d="M16 16l16 16M32 16L16 32" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round"/>
          <circle cx="24" cy="24" r="3.4" fill="#ffffff"/>
        </svg>
        <div class="xi-brand">XIYORA</div>
        <div class="xi-sub">Crafted Comfort &middot; Sourced for India</div>
      </div>
      <div class="xi-count-row">
        <div class="xi-count-item"><div class="xi-count-num">37+</div><div class="xi-count-label">Products</div></div>
        <div class="xi-count-item"><div class="xi-count-num">&#x1F1E8;&#x1F1F3;&#x2192;&#x1F1EE;&#x1F1F3;</div><div class="xi-count-label">Bingxi Partner</div></div>
        <div class="xi-count-item"><div class="xi-count-num">93%</div><div class="xi-count-label">Natural Latex</div></div>
      </div>
      <div class="xi-progress-bar"></div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
